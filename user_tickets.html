<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiket Saya - TMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="d-flex">
        <!-- ================= SIDEBAR USER ================= -->
        <div class="sidebar d-flex flex-column flex-shrink-0 p-3" style="width: 250px;">
            <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <i class="fas fa-ticket-alt text-primary me-2 fs-4"></i>
                <span class="fs-5 fw-bold" id="userName">TMS User</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="user_dashboard.html" class="nav-link">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="user_tickets.html" class="nav-link active">
                        <i class="fas fa-ticket-alt"></i> Tiket Saya
                    </a>
                </li>
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <i class="fas fa-search"></i> Cari Event
                    </a>
                </li>
            </ul>
            <hr>
            <a href="#" class="nav-link text-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>

        <!-- ================= MAIN CONTENT ================= -->
        <div class="flex-grow-1 p-4 bg-light">

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold mb-1">Tiket Saya</h2>
                    <p class="text-muted small mb-0">Daftar semua tiket yang pernah Anda beli</p>
                </div>
                <a href="index.html" class="btn btn-primary rounded-pill px-4">
                    <i class="fas fa-plus me-2"></i>Cari Event Baru
                </a>
            </div>

            <!-- FILTER STATUS -->
            <div class="mb-4">
                <p class="fw-semibold text-muted small mb-2">
                    <i class="fas fa-filter me-1"></i>Filter Status:
                </p>
                <div class="d-flex flex-wrap">
                    <button class="filter-btn active" onclick="filterTickets('all', this)">
                        <i class="fas fa-list me-1"></i>Semua
                    </button>
                    <button class="filter-btn" onclick="filterTickets('aktif', this)">
                        <i class="fas fa-check-circle me-1"></i>Aktif
                    </button>
                    <button class="filter-btn" onclick="filterTickets('selesai', this)">
                        <i class="fas fa-history me-1"></i>Selesai
                    </button>
                </div>
            </div>

            <!-- Tabel Tiket -->
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" class="text-center" style="width: 80px;">Gambar</th>
                                <th scope="col">Nama Event</th>
                                <th scope="col">Tanggal</th>
                                <th scope="col">Status</th>
                                <th scope="col" class="text-center">Kode Tiket</th>
                                <th scope="col" class="text-center" style="width: 150px;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="ticketsTableBody">
                            <!-- Data diisi oleh JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/script.js"></script>
</body>
</html>
